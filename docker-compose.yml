services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_PATH: /app/data/updater.db
      PACKAGES_PATH: /app/packages
      DOWNLOAD_BASE_URL: /downloads
      TRUST_PROXY: 1
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INSTALLATION_KEY: ${INSTALLATION_KEY}
    volumes:
      - backend-data:/app/data
      - backend-packages:/app/packages
    expose:
      - "3333"
    networks:
      - updater-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - updater-net
    labels:
      easypanel.ssl: "letsencrypt"

volumes:
  backend-data:
    driver: local
  backend-packages:
    driver: local

networks:
  updater-net:
    driver: bridge
