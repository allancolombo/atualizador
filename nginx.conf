server {
    listen 80;
    server_name atualizacao.goopedir.com _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:3333/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 1024M;
    }

    location /downloads/ {
        proxy_pass http://backend:3333/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://backend:3333/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api-docs.json {
        proxy_pass http://backend:3333/api-docs.json;
    }

    location /health {
        proxy_pass http://backend:3333/health;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ ^/_next/static/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
