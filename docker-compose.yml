services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_PATH: /app/data/updater.db
      PACKAGES_PATH: /app/packages
      DOWNLOAD_BASE_URL: /downloads
      TRUST_PROXY: 1

      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INSTALLATION_KEY: ${INSTALLATION_KEY}
      PORTAL_CERTIFICATE_BASE_URL: ${PORTAL_CERTIFICATE_BASE_URL:-https://cert.atualizacao.goopedir.com}

    volumes:
      - backend-data:/app/data
      - backend-packages:/app/packages

    expose:
      - "3333"

    networks:
      - updater-net

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "80"

    networks:
      - updater-net
      - easypanel

    labels:
      easypanel.ssl: "letsencrypt"
      traefik.enable: "true"
      traefik.http.routers.atualizador-cert.rule: "Host(`cert.atualizacao.goopedir.com`) && Path(`/api/v1/portal/auth/certificate`)"
      traefik.http.routers.atualizador-cert.entrypoints: "websecure"
      traefik.http.routers.atualizador-cert.tls: "true"
      traefik.http.routers.atualizador-cert.tls.certresolver: "letsencrypt"
      traefik.http.routers.atualizador-cert.tls.options: "portal-mtls@file"
      traefik.http.routers.atualizador-cert.middlewares: "portal-client-cert@file"
      traefik.http.routers.atualizador-cert.service: "atualizador-cert"
      traefik.http.services.atualizador-cert.loadbalancer.server.port: "80"


volumes:
  backend-data:
    driver: local

  backend-packages:
    driver: local


networks:
  updater-net:
    driver: bridge

  easypanel:
    external: true
