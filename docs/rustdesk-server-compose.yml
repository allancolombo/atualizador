services:

  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs -r remoto.goopedir.com:21117 -k _
    restart: unless-stopped
    network_mode: host
    volumes:
      - rustdesk-data:/root
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr -k _
    restart: unless-stopped
    network_mode: host
    volumes:
      - rustdesk-data:/root


volumes:
  rustdesk-data:
    driver: local
