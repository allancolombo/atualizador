map $ssl_client_s_dn $client_cert_document {
    default "";
    ~(?:CNPJ|OID\.2\.16\.76\.1\.3\.3)=?([^,\/]+) $1;
    ~(?:CPF|OID\.2\.16\.76\.1\.3\.1)=?([^,\/]+) $1;
}

server {
    listen 80;
    server_name atualizacao.goopedir.com _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:3333/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 1024M;
    }

    location /downloads/ {
        proxy_pass http://backend:3333/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://backend:3333/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api-docs.json {
        proxy_pass http://backend:3333/api-docs.json;
    }

    location /health {
        proxy_pass http://backend:3333/health;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ ^/_next/static/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    server_name cert.atualizacao.goopedir.com;

    ssl_certificate /etc/nginx/certs/server/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server/privkey.pem;

    ssl_client_certificate /etc/nginx/certs/client-ca/icp-brasil-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 5;

    location = /api/v1/portal/auth/certificate {
        proxy_pass http://backend:3333/api/v1/portal/auth/certificate;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Issuer $ssl_client_i_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Client-Cert-Document $client_cert_document;
    }

    location / {
        return 404;
    }
}
